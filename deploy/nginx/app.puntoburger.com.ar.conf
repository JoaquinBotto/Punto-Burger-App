# ==============================================================================
# Punto Burger - Configuración Nginx para app.puntoburger.com.ar
# Ubicación en servidor: /etc/nginx/sites-available/app.puntoburger.com.ar.conf
# Enlace simbólico: /etc/nginx/sites-enabled/app.puntoburger.com.ar.conf
# ==============================================================================

# Upstream al proceso Next.js 16 supervisado por PM2
upstream nextjs_backend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# Servidor HTTP (Puerto 80)
# Antes de Certbot: Procesa peticiones y valida ACME challenges.
# Tras ejecutar Certbot: Certbot configurará la redirección automática a HTTPS.
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name app.puntoburger.com.ar;

    # Ruta para validación de certificados SSL vía Certbot / Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Descomentar para forzar redirección HTTPS una vez instalado el certificado SSL:
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # Configuración de proxy para HTTP (se traslada a bloque 443 tras Certbot)
    location / {
        proxy_pass http://nextjs_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Assets estáticos de Next.js (_next/static): Cache inmutable
    location /_next/static/ {
        proxy_pass http://nextjs_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Rutas críticas de juego y API: NUNCA cachear
    location ~* ^/(api|table|play)/ {
        proxy_pass http://nextjs_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    # Seguridad básica en cabeceras
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

